<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Evoluto - Journey Builder & Note Mapping</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts & FontAwesome per Icone -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-muted: #7f8c8d;
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 30px 20px; }

    .container { max-width: 1200px; margin: 0 auto; }
    header { margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.6rem; font-weight: 700; color: #1e293b; }
    header p { color: var(--text-muted); font-size: 0.9rem; }

    /* Configurazione Credenziali */
    .config-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 25px;
      border: 1px solid var(--border);
    }
    .config-grid { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 12px; align-items: end; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.8rem; font-weight: 600; color: #475569; }
    .form-group input {
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; outline: none;
    }
    .btn {
      background-color: var(--primary); color: white; border: none; padding: 10px 18px;
      border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 0.85rem;
    }
    .btn:hover { background-color: #2563eb; }

    /* Layout Griglia Contatti */
    .crm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; }

    .lead-card {
      background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); overflow: hidden; display: flex; flex-direction: column;
    }
    .lead-header {
      padding: 16px; background-color: #f8fafc; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .lead-id { font-weight: 700; font-size: 0.95rem; }
    .status-badge {
      padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
    }
    .badge-ko { background-color: #fee2e2; color: #991b1b; }
    .badge-ok { background-color: #d1fae5; color: #065f46; }
    .badge-pending { background-color: #fef3c7; color: #92400e; }

    .lead-body { padding: 16px; flex-grow: 1; }
    .section-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 700; margin-bottom: 8px; }

    /* Mappatura Semantica di LAST_NOTE */
    .note-box {
      background-color: #f8fafc; border-left: 3px solid var(--primary); padding: 12px;
      border-radius: 0 6px 6px 0; font-size: 0.85rem; color: #334155; margin-bottom: 15px;
      white-space: pre-line; /* FONDAMENTALE: Mantiene gli a capo */
      line-height: 1.5;
    }

    /* Customer Journey Trigger Box */
    .journey-box {
      background-color: #eff6ff; border: 1px dashed var(--primary); padding: 12px; border-radius: 8px;
    }
    .journey-step { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: #1e40af; margin-top: 6px; }
    .journey-step i { font-size: 1rem; color: var(--primary); }

    .loader { text-align: center; padding: 40px; color: var(--text-muted); grid-column: 1 / -1; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>CRM Evoluto & Journey Builder</h1>
        <p>Mappatura semantica automatica della colonna <code>LAST_NOTE</code> con innesco automazioni Cloud</p>
      </div>
    </header>

    <!-- Configurazione Connessione Supabase -->
    <div class="config-card">
      <div class="config-grid">
        <div class="form-group">
          <label>URL Progetto Supabase</label>
          <input type="text" id="supabaseUrl" placeholder="https://xyz.supabase.co">
        </div>
        <div class="form-group">
          <label>Anon Key (Pubblica)</label>
          <input type="password" id="supabaseKey" placeholder="eyJhbGciOi...">
        </div>
        <div class="form-group">
          <label>Nome Tabella</label>
          <input type="text" id="tableName" value="clienti">
        </div>
        <button class="btn" onclick="initAndFetch()"><i class="fa-solid fa-sync"></i> Connetti & Carica</button>
      </div>
    </div>

    <!-- Griglia dei Contatti -->
    <div id="crmContainer" class="crm-grid">
      <div class="loader">
        <i class="fa-solid fa-database fa-spin fa-2x"></i>
        <p style="margin-top: 10px;">Inserisci le credenziali di Supabase per connettere il CRM...</p>
      </div>
    </div>
  </div>

  <script>
    let supabaseClient = null;

    async function initAndFetch() {
      const url = document.getElementById('supabaseUrl').value.trim();
      const key = document.getElementById('supabaseKey').value.trim();
      const tableName = document.getElementById('tableName').value.trim();
      const container = document.getElementById('crmContainer');

      if (!url || !key || !tableName) {
        alert("Inserisci URL, Anon Key e Nome Tabella!");
        return;
      }

      container.innerHTML = `<div class="loader"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><p>Connessione in corso...</p></div>`;

      try {
        supabaseClient = window.supabase.createClient(url, key);
        const { data, error } = await supabaseClient.from(tableName).select('*');

        if (error) throw error;

        renderCRM(data);
      } catch (err) {
        container.innerHTML = `<div class="loader" style="color: var(--danger);"><i class="fa-solid fa-triangle-exclamation fa-2x"></i><p>Errore: ${err.message}</p></div>`;
      }
    }

    // Algoritmo di Mappatura Semantica e Journey Trigger
    function renderCRM(leads) {
      const container = document.getElementById('crmContainer');
      container.innerHTML = '';

      if (!leads || leads.length === 0) {
        container.innerHTML = `<div class="loader"><p>Nessun record trovato nella tabella.</p></div>`;
        return;
      }

      leads.forEach(lead => {
        const rawNote = lead.LAST_NOTE || 'Nessuna nota registrata.';
        const recStatus = lead.REC || 'N/D';

        // Parsing dell'ultimo evento presente in LAST_NOTE
        const journeyAction = parseNoteAndBuildJourney(rawNote, recStatus);

        const card = document.createElement('div');
        card.className = 'lead-card';
        card.innerHTML = `
          <div class="lead-header">
            <span class="lead-id"><i class="fa-solid fa-user-tag"></i> Record ID: ${lead.id || 'N/D'}</span>
            <span class="status-badge ${recStatus === 'KO' ? 'badge-ko' : 'badge-ok'}">${recStatus}</span>
          </div>
          <div class="lead-body">
            <div class="section-title">Mappatura Semantica (LAST_NOTE)</div>
            <div class="note-box">${rawNote}</div>

            <div class="section-title">Automazione Journey Innescata</div>
            <div class="journey-box">
              <strong style="font-size: 0.8rem; color: #1e3a8a;">Azione Cloud Automatizzata:</strong>
              <div class="journey-step">
                <i class="${journeyAction.icon}"></i>
                <span>${journeyAction.actionText}</span>
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Analizza il testo della nota ed esegue il routing nel Journey Builder
    function parseNoteAndBuildJourney(noteText, recStatus) {
      const upperText = noteText.toUpperCase();

      if (recStatus === 'KO' || upperText.includes('KO')) {
        return {
          icon: 'fa-solid fa-user-slash',
          actionText: 'Spostato in lista "Retargeting Nurturing" (Nessun ricontatto telefonico)'
        };
      } else if (upperText.includes('RISP E RIAG') || upperText.includes('RIAG')) {
        return {
          icon: 'fa-solid fa-calendar-check',
          actionText: 'Task automatico creato: Ricontatto prioritario per agente'
        };
      } else if (upperText.includes('SPENTO') || upperText.includes('NO RISP')) {
        return {
          icon: 'fa-solid fa-paper-plane',
          actionText: 'Programmato invio SMS / WhatsApp automatico di follow-up tra 24h'
        };
      } else {
        return {
          icon: 'fa-solid fa-clock',
          actionText: 'In attesa di aggiornamento stato da parte dell\'operatore'
        };
      }
    }
  </script>
</body>
</html>
